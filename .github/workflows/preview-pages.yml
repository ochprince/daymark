name: Deploy preview (feat branches)

# 分支预览：主站仍然发布在 /daymark/（来自 main），
# 当前分支发布到 /daymark/preview/，审核通过后再合并回 main。
on:
  push:
    branches: ['feat/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 与 deploy-pages.yml 分开的并发组：两边共用 pages 组的话，
# 分支推送会把正在跑的 main 部署直接取消掉（版本发布被跳过）
concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 主站内容：始终取 main，保证预览不影响线上正式版
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # 预览内容：当前分支
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build main site (/)
        working-directory: main
        run: |
          npm ci
          npm run build

      - name: Build preview (/preview/)
        working-directory: preview
        env:
          VITE_PREVIEW: '1'
        run: |
          npm ci
          npm test
          npm run build -- --base=/daymark/preview/

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r main/dist/. _site/
          mkdir -p _site/preview
          cp -r preview/dist/. _site/preview/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 用独立的环境名：仓库的 github-pages 环境把部署分支限制为 main，
    # 预览分支借用它会被策略挡下（部署失败）。Pages 站点本身是同一个。
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
