<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daymark · 刻度</title>
    <meta
      name="description"
      content="Daymark 刻度 —— 记录值得纪念的日子，看它已经走过多少天。数据只保存在你的设备上。"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daymark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /*
       * 首帧之前把底色定下来，避免闪白。
       *
       * 这里**不能**再看系统的深浅色：主题是「皮肤」的一部分（data-skin），
       * 系统深浅只在用户自己打开「跟随系统」时才参与。
       * 之前的写法是读旧的 daymark.theme.v2（没有就默认 system），
       * 于是关着跟随系统的人，一换系统深色，页面底色也跟着黑掉——
       * 皮肤明明没变，界面却整体变暗，就是这个 data-theme 在背后翻。
       */
      (function () {
        var root = document.documentElement
        var pack = 'jelly'
        try {
          var raw = localStorage.getItem('daymark.skin.v1')
          if (raw) {
            var skin = JSON.parse(raw)
            if (skin && typeof skin.pack === 'string') pack = skin.pack
            if (
              skin &&
              skin.followSystem === true &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            ) {
              pack = 'night'
            }
          }
        } catch (error) {
          /* 读坏了就当软糖 */
        }
        var theme = pack === 'night' ? 'dark' : 'light'
        root.dataset.theme = theme
        root.style.colorScheme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#F7F5F2' : '#08090C')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
