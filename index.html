<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daymark · 刻度</title>
    <meta
      name="description"
      content="Daymark 刻度 —— 记录值得纪念的日子，看它已经走过多少天。数据只保存在你的设备上。"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Daymark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark light" />
    <script>
      /* 主题在首帧之前落定，避免闪白/闪黑 */
      (function () {
        var root = document.documentElement
        try {
          var stored = localStorage.getItem('daymark.theme.v2')
          var mode = stored === 'system' || stored === 'light' || stored === 'dark' ? stored : 'system'
          var system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          var theme = mode === 'system' ? system : mode
          root.dataset.theme = theme
          root.dataset.themeMode = mode
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F7F5F2' : '#08090C')
        } catch (error) {
          root.dataset.theme = 'dark'
          root.dataset.themeMode = 'system'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
