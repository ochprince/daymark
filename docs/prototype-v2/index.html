<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>刻度 Daymark · 原型 v2（焦点 · 养成 · 藏馆 · 风格包）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&family=Instrument+Serif:ital@0;1&family=Silkscreen:wght@400;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="proto.css" />
    <link rel="stylesheet" href="overlays.css" />
    <link rel="stylesheet" href="tabs.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <!-- 像素风格包用的像素化滤镜 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <filter id="pixelate" x="0" y="0" width="100%" height="100%">
          <feFlood x="2" y="2" height="1" width="1" />
          <feComposite width="6" height="6" />
          <feTile result="a" />
          <feComposite in="SourceGraphic" in2="a" operator="in" />
          <feMorphology operator="dilate" radius="3" />
        </filter>
      </defs>
    </svg>

    <div class="deck">
      <aside class="flows" id="flows"></aside>

      <section class="stagewrap">
        <div class="phone-col">
          <div class="phone" id="phone" data-theme="jelly">
            <div class="island"></div>
            <div class="screen" id="screen">
              <div class="sb">
                <span>9:41</span>
                <span class="sb-r">
                  <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor" /><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor" /><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor" /><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor" /></svg>
                  <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 8.8 A3.4 3.4 0 0 1 10.4 8.8 Z M2.8 6 A7.4 7.4 0 0 1 13.2 6 L11.8 7.5 A5.4 5.4 0 0 0 4.2 7.5 Z M0 3.1 A11.4 11.4 0 0 1 16 3.1 L14.6 4.6 A9.4 9.4 0 0 0 1.4 4.6 Z" fill="currentColor" /></svg>
                  <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4" /><rect x="2" y="2" width="18" height="9" rx="2" fill="currentColor" /><path d="M25 4.5 V8.5 A2 2 0 0 0 25 4.5 Z" fill="currentColor" opacity=".4" /></svg>
                </span>
              </div>
              <div class="view" id="view"></div>
              <nav class="tabbar" id="tabbar"></nav>
              <div class="ov" id="ov"></div>
              <div id="toastL"></div>
            </div>
          </div>
          <div class="phone-caption" id="caption"></div>
        </div>
      </section>

      <aside class="notes" id="notes"></aside>
    </div>

    <script src="creatures.js"></script>
    <script src="core.js"></script>
    <script src="overlays.js"></script>
    <script src="tabs.js"></script>
    <script src="demo.js"></script>
    <script>DM.boot()</script>
  </body>
</html>
